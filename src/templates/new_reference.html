{% extends "layout.html" %}

{% block title %}
Create a new reference
{% endblock %}

{% block body %}

<h2>Create a new reference</h2>

<form action="/create_reference" method="post">
  <label for="author">Author:</label><br>
  <input type="text" id="author" name="author" required placeholder="Example: John Smith or Smith, John"><br>
  
  <label for="title">Title:</label><br>
  <input type="text" id="title" name="title" required minlength="10" placeholder="Book name (minimum. 10 characters)"><br>
  
  <label for="year">Year:</label><br>
  <input type="number" id="year" name="year" required min="1000" max="9999"><br>
  <label for="reftype">Type:</label><br>
  <select id="reftype" name="reftype">
    <option value="article">Article</option>
    <option value="book">Book</option>
    <option value="booklet">Booklet</option>
    <option value="conference">Conference</option>
    <option value="inbook">Inbook</option>
    <option value="incollection">Works published in a book (incollection)</option>
    <option value="inproceedings">Papers published in conference proceedings (inproceedings)</option>
    <option value="manual">Manual</option>
    <option value="mastersthesis">Masters thesis</option>
    <option value="misc">Misc</option>
    <option value="phdthesis">PhD thesis</option>
    <option value="proceedings">Proceedings</option>
    <option value="techreport">Techreport</option>
    <option value="unpublished">Unpublished</option>
    </select>
  <br><br>
  <button type="submit">
    Create
  </button>
</form>

{% endblock %}
